<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>模型训练 - EaseMind</title>
  <link rel="stylesheet" href="/assets/css/polish.css">
  <link rel="icon" type="image/svg+xml" href="/assets/ease-mind-logo.svg">
</head>
<body>
  <script src="/assets/js/app.js"></script>
  <script>
    if (!App.requireAdmin()) throw new Error("no access");

    App.renderShell("training", "模型训练", `
      <style>
        /* 专业训练两栏布局：宽屏左右并排，窄屏自动堆叠 */
        .training-grid { display: grid; grid-template-columns: 420px 1fr; gap: 18px; align-items: start; }
        @media (max-width: 1100px) { .training-grid { grid-template-columns: 1fr; } }
      </style>
      <div class="training-grid">
        <!-- 左栏：训练配置 -->
        <div>
      <div class="card">
        <div class="card-header">
          <div>
            <div class="card-title">专业训练配置</div>
            <div class="card-subtitle">自定义全部训练参数</div>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">基础模型</label>
            <select class="form-select" id="t-model"></select>
          </div>
          <div class="form-group">
            <label class="form-label">任务名称</label>
            <input class="form-input" id="t-name" placeholder="例如：客服模型-专业训练">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">训练数据集（可多选）</label>
          <div id="t-datasets" class="dataset-checklist"></div>
        </div>
        <div id="param-fields"></div>

        <!-- 预设对话评测 -->
        <div class="form-group mt-3">
          <label class="form-label">💬 预设对话评测 <span class="text-muted text-xs">（可选，训练完成后自动对话，人工打分正确+1/错误-1）</span></label>
          <div id="eval-dialog-list"></div>
          <div style="border:1px dashed var(--border);border-radius:10px;padding:12px;margin-top:8px">
            <div class="form-row" style="margin-bottom:8px">
              <input class="form-input" id="eval-q" placeholder="问题（如：EaseMind 是什么？）">
            </div>
            <div class="form-row" style="margin-bottom:8px">
              <input class="form-input" id="eval-a" placeholder="参考答案（用于对比与纠偏训练）">
            </div>
            <button class="btn btn-secondary btn-sm" id="add-eval-btn">+ 添加对话</button>
          </div>
        </div>

        <button class="btn btn-primary btn-lg btn-block mt-3" id="start-btn">开始专业训练</button>
      </div>
        </div>

        <!-- 右栏：进度 + 评测 + 历史 -->
        <div>
      <div class="card" id="progress-placeholder">
        <div class="empty-state"><div class="empty-icon">✦</div><div class="empty-text">配置左侧参数并开始训练后，这里将实时显示进度、Loss 曲线与对话评测</div></div>
      </div>
      <div class="card" id="progress-card" style="display:none">
        <div class="card-header">
          <div>
            <div class="card-title">训练进度</div>
            <div class="card-subtitle">实时 Loss 曲线与日志输出</div>
          </div>
          <div class="flex items-center gap-2">
            <span id="t-status" class="badge badge-accent">运行中</span>
            <span id="pct" class="text-muted text-sm">0%</span>
          </div>
        </div>
        <div class="progress-bar mb-3"><div class="progress-fill" id="p-fill" style="width:0%"></div></div>

        <div class="form-row mb-3" style="align-items:flex-end">
          <div class="form-group" style="margin:0;flex:1">
            <label class="form-label">Loss 曲线</label>
            <div id="loss-chart" class="loss-chart" style="height:240px"></div>
          </div>
          <div style="text-align:right;min-width:140px">
            <div class="text-xs text-muted">当前 Loss</div>
            <div id="cur-loss" style="font-size:22px;font-weight:700;color:var(--accent);font-family:var(--font-serif)">-</div>
            <div class="text-xs text-muted">采样点 <span id="loss-count">0</span></div>
          </div>
        </div>

        <div>
          <label class="form-label">训练日志</label>
          <div id="log-box" class="log-viewer" style="max-height:340px"></div>
        </div>

        <!-- 对话评测打分面板（训练完成且有预设对话时显示） -->
        <div id="eval-panel" style="display:none;margin-top:16px">
          <div class="flex items-center justify-between mb-2">
            <label class="form-label" style="margin:0">💬 对话评测打分</label>
            <div class="flex items-center gap-2">
              <button class="btn btn-primary btn-sm" id="run-eval-btn">▶ 开始评测</button>
              <span class="badge" id="eval-score-badge" style="background:var(--surface-hover);font-size:14px;font-weight:700">得分 0</span>
              <button class="btn btn-secondary btn-sm" id="reinforce-btn">⚡ 用评分追加训练</button>
            </div>
          </div>
          <div class="alert alert-info" style="font-size:12px">
            微调模型已逐条回答预设问题。请对比「参考答案」与「模型回答」打分：<strong>✓ 正确 +1</strong> / <strong>✗ 错误 -1</strong>。
            打分后点击「追加训练」，错误对话（问题+参考答案）将被加权强化训练，实现纠偏。
          </div>
          <div id="eval-dialog-results" style="display:flex;flex-direction:column;gap:10px"></div>
        </div>
      </div>

      <div class="card mt-3">
        <div class="card-header">
          <div>
            <div class="card-title">训练任务历史</div>
            <div class="card-subtitle">所有训练与微调记录</div>
          </div>
          <button class="btn btn-secondary btn-sm" onclick="loadHistory()">刷新</button>
        </div>
        <div id="task-history"></div>
      </div>
        </div>
      </div>
    `);

    let paramConfig = {};
    let lossVals = [];
    let lossChartTimer = null;
    let _historyCache = [];
    let evalDialogs = [];      // 预设对话（未提交前）
    let currentTaskId = null;  // 当前训练任务

    async function loadOptions() {
      try {
        const [models, datasets] = await Promise.all([
          App.api.get("/api/models"),
          App.api.get("/api/datasets"),
        ]);
        const ready = models.filter(m => m.status === "ready");
        document.getElementById("t-model").innerHTML = ready.length
          ? ready.map(m => `<option value="${m.id}">${App.escapeHtml(m.name)}${m.source === "finetune" ? "（微调模型）" : ""}</option>`)
          : `<option value="">（请先下载模型）</option>`;
        const dsEl = document.getElementById("t-datasets");
        dsEl.innerHTML = datasets.length
          ? datasets.map(d => `
            <label class="checklist-item">
              <input type="checkbox" value="${d.id}">
              <span>${App.escapeHtml(d.name)} <span class="text-muted text-xs">（${d.sample_count}样本）</span></span>
            </label>`).join("")
          : `<div class="text-muted text-sm">（请先上传数据集）</div>`;
      } catch (err) { App.toast(err.message, "error"); }
    }

    async function loadParams() {
      try {
        const data = await App.api.get("/api/training/params");
        paramConfig = data?.data?.professional_params || {};
        const el = document.getElementById("param-fields");
        el.innerHTML = Object.entries(paramConfig).map(([key, cfg]) => `
          <div class="form-group">
            <label class="form-label">${cfg.label} <span class="text-muted text-xs">(${key})</span></label>
            <input class="form-input" type="number" id="param-${key}" value="${cfg.default}" min="${cfg.min}" max="${cfg.max}" step="${key.includes("rate") || key.includes("dropout") || key.includes("decay") ? "0.0001" : "1"}">
            <div class="form-hint">范围 ${cfg.min} ~ ${cfg.max}，默认 ${cfg.default}</div>
          </div>
        `).join("");
      } catch (err) { App.toast(err.message, "error"); }
    }

    // 绘制 Loss 曲线（SVG 折线）
    function drawLossChart() {
      const el = document.getElementById("loss-chart");
      if (!el) return;
      if (lossVals.length === 0) {
        el.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-muted);font-size:13px">暂无 Loss 数据</div>`;
        return;
      }
      const W = 800, H = 240, P = 40;
      const maxL = Math.max(...lossVals, 0.1);
      const minL = Math.min(...lossVals, 0);
      const range = (maxL - minL) || 1;
      const stepX = lossVals.length > 1 ? (W - 2 * P) / (lossVals.length - 1) : 0;
      const pts = lossVals.map((l, i) => {
        const x = P + i * stepX;
        const y = H - P - ((l - minL) / range) * (H - 2 * P);
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(" ");
      const lastX = P + (lossVals.length - 1) * stepX;
      const lastY = H - P - ((lossVals[lossVals.length - 1] - minL) / range) * (H - 2 * P);
      const midY = H - P - (0.5) * (H - 2 * P);
      const midVal = (maxL + minL) / 2;
      el.innerHTML = `
        <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:100%">
          <g class="grid-lines">
            <line x1="${P}" y1="${P}" x2="${W - P}" y2="${P}" stroke="#E8E6DC" stroke-dasharray="3 3" stroke-width="1"/>
            <line x1="${P}" y1="${midY}" x2="${W - P}" y2="${midY}" stroke="#E8E6DC" stroke-dasharray="3 3" stroke-width="1"/>
            <line x1="${P}" y1="${H - P}" x2="${W - P}" y2="${H - P}" stroke="#E8E6DC" stroke-dasharray="3 3" stroke-width="1"/>
          </g>
          <line x1="${P}" y1="${P}" x2="${P}" y2="${H - P}" stroke="#D8D5C7" stroke-width="1"/>
          <line x1="${P}" y1="${H - P}" x2="${W - P}" y2="${H - P}" stroke="#D8D5C7" stroke-width="1"/>
          <g class="axis-labels">
            <text x="${P - 6}" y="${P + 4}" text-anchor="end" fill="#b0ada3" font-size="9">${maxL.toFixed(3)}</text>
            <text x="${P - 6}" y="${midY + 3}" text-anchor="end" fill="#b0ada3" font-size="9">${midVal.toFixed(3)}</text>
            <text x="${P - 6}" y="${H - P + 3}" text-anchor="end" fill="#b0ada3" font-size="9">${minL.toFixed(3)}</text>
          </g>
          <polyline points="${pts}" fill="none" stroke="#CC785C" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
          <circle cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" r="3.5" fill="#CC785C" stroke="#fff" stroke-width="1.5"/>
        </svg>
      `;
    }

    function appendLoss(value) {
      if (typeof value !== "number" || isNaN(value)) return;
      lossVals.push(value);
      const curEl = document.getElementById("cur-loss");
      const cntEl = document.getElementById("loss-count");
      if (curEl) curEl.textContent = value.toFixed(4);
      if (cntEl) cntEl.textContent = lossVals.length;
      // 节流重绘：最多每 300ms 一次
      if (lossChartTimer) return;
      lossChartTimer = setTimeout(() => {
        drawLossChart();
        lossChartTimer = null;
      }, 300);
    }

    // ---- 预设对话编辑器 ----
    function renderEvalEditor() {
      const el = document.getElementById("eval-dialog-list");
      if (evalDialogs.length === 0) {
        el.innerHTML = `<div class="text-muted text-sm" style="padding:4px 0">尚未添加预设对话</div>`;
        return;
      }
      el.innerHTML = evalDialogs.map((d, i) => `
        <div class="list-item" style="padding:8px 12px">
          <div class="list-item-main">
            <div style="font-size:13px"><strong>Q${i + 1}.</strong> ${App.escapeHtml(d.question)}</div>
            <div class="text-muted text-xs">参考：${App.escapeHtml(d.answer || "（无）")}</div>
          </div>
          <button class="btn btn-ghost btn-sm" onclick="removeEval(${i})">删除</button>
        </div>`).join("");
    }
    window.removeEval = (i) => { evalDialogs.splice(i, 1); renderEvalEditor(); };
    document.getElementById("add-eval-btn").onclick = () => {
      const q = document.getElementById("eval-q").value.trim();
      const a = document.getElementById("eval-a").value.trim();
      if (!q) { App.toast("请填写问题", "error"); return; }
      if (evalDialogs.length >= 20) { App.toast("最多 20 条对话", "error"); return; }
      evalDialogs.push({ question: q, answer: a });
      document.getElementById("eval-q").value = "";
      document.getElementById("eval-a").value = "";
      renderEvalEditor();
    };
    renderEvalEditor();

    document.getElementById("start-btn").onclick = async () => {
      const modelId = document.getElementById("t-model").value;
      const datasetIds = Array.from(document.querySelectorAll('#t-datasets input[type="checkbox"]:checked')).map(cb => cb.value);
      const name = document.getElementById("t-name").value.trim() || `专业训练_${new Date().toLocaleString("zh-CN")}`;
      if (!modelId) { App.toast("请选择基础模型", "error"); return; }
      if (datasetIds.length === 0) { App.toast("请至少选择一个数据集", "error"); return; }
      const params = {};
      Object.keys(paramConfig).forEach(key => {
        const v = parseFloat(document.getElementById(`param-${key}`).value);
        params[key] = isNaN(v) ? paramConfig[key].default : v;
      });
      const btn = document.getElementById("start-btn");
      btn.disabled = true; btn.textContent = "提交中...";
      try {
        const task = await App.api.post("/api/training", {
          name, model_id: modelId, dataset_ids: datasetIds, mode: "professional", params,
          eval_dialogs: evalDialogs.length ? evalDialogs : undefined,
        });
        App.toast("训练已启动", "success");
        startStreaming(task.id);
        loadHistory();
      } catch (err) { App.toast(err.message, "error"); }
      finally { btn.disabled = false; btn.textContent = "开始专业训练"; }
    };

    // ---- 对话评测打分面板 ----
    function renderEvalResults(task) {
      const panel = document.getElementById("eval-panel");
      const listEl = document.getElementById("eval-dialog-results");
      const badge = document.getElementById("eval-score-badge");
      const dialogs = task.eval_dialogs || [];
      if (!dialogs.length || task.status !== "completed") { panel.style.display = "none"; return; }
      currentTaskId = task.id;
      badge.textContent = `得分 ${task.eval_score || 0}`;
      badge.style.color = (task.eval_score || 0) >= 0 ? "var(--accent)" : "#c0392b";
      panel.style.display = "";
      // 是否已生成模型回答
      const hasReplies = dialogs.some(d => (d.model_reply || "").trim());
      document.getElementById("run-eval-btn").style.display = hasReplies ? "none" : "";
      if (!hasReplies) {
        listEl.innerHTML = `<div class="alert alert-info">已保存 ${dialogs.length} 条预设对话。点击右上角「▶ 开始评测」，用训练好的模型逐条生成回答后再打分。</div>`;
        return;
      }
      listEl.innerHTML = dialogs.map((d, i) => {
        const sc = d.score || 0;
        const borderColor = sc === 1 ? "#27ae60" : sc === -1 ? "#c0392b" : "var(--border)";
        return `
        <div style="border:1px solid ${borderColor};border-radius:10px;overflow:hidden">
          <div style="padding:8px 12px;background:var(--surface-hover);font-size:12px;font-weight:600;border-bottom:1px solid var(--border)">
            Q${i + 1}. ${App.escapeHtml(d.question)}
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border)">
            <div style="padding:10px 12px;background:var(--surface)">
              <div style="font-size:11px;color:var(--text-muted);margin-bottom:4px">参考答案</div>
              <div style="font-size:13px;line-height:1.5;white-space:pre-wrap;word-break:break-word">${App.escapeHtml(d.answer || "（无）")}</div>
            </div>
            <div style="padding:10px 12px;background:var(--surface)">
              <div style="font-size:11px;color:var(--accent);margin-bottom:4px">模型回答</div>
              <div style="font-size:13px;line-height:1.5;white-space:pre-wrap;word-break:break-word">${App.escapeHtml(d.model_reply || "（空）")}</div>
            </div>
          </div>
          <div style="display:flex;gap:8px;padding:8px 12px;background:var(--surface);border-top:1px solid var(--border)">
            <button class="btn btn-sm ${sc === 1 ? "btn-primary" : "btn-secondary"}" onclick="scoreDialog(${i}, ${sc === 1 ? 0 : 1})">✓ 正确 +1</button>
            <button class="btn btn-sm ${sc === -1 ? "btn-primary" : "btn-secondary"}" onclick="scoreDialog(${i}, ${sc === -1 ? 0 : -1})">✗ 错误 -1</button>
            ${sc !== 0 ? `<span class="text-xs text-muted" style="align-self:center">已评：${sc === 1 ? "正确" : "错误"}</span>` : ""}
          </div>
        </div>`;
      }).join("");
    }

    window.scoreDialog = async (index, score) => {
      if (!currentTaskId) return;
      try {
        const res = await App.api.post(`/api/training/${currentTaskId}/eval/score`, { index, score });
        const task = _historyCache.find(t => t.id === currentTaskId) || {};
        task.eval_dialogs = res.data.dialogs;
        task.eval_score = res.data.eval_score;
        task.status = "completed";
        renderEvalResults(task);
        loadHistory();
      } catch (err) { App.toast(err.message, "error"); }
    };

    // 开始评测：触发后端独立线程生成模型回答，然后轮询刷新
    document.getElementById("run-eval-btn").onclick = async () => {
      if (!currentTaskId) return;
      const btn = document.getElementById("run-eval-btn");
      btn.disabled = true; btn.textContent = "评测中...";
      try {
        await App.api.post(`/api/training/${currentTaskId}/eval/run`, {});
        App.toast("评测已启动，正在生成模型回答...", "success");
        // 轮询直到出现 model_reply
        const poll = setInterval(async () => {
          try {
            const t = await App.api.get(`/api/training/${currentTaskId}`);
            const dialogs = t.eval_dialogs || [];
            if (dialogs.some(d => (d.model_reply || "").trim())) {
              clearInterval(poll);
              const cached = _historyCache.find(x => x.id === currentTaskId);
              if (cached) { cached.eval_dialogs = dialogs; cached.eval_score = t.eval_score; }
              renderEvalResults(cached || t);
              App.toast("评测完成，请打分", "success");
              btn.disabled = false; btn.textContent = "▶ 开始评测";
            }
          } catch (e) { /* 继续轮询 */ }
        }, 3000);
        // 最多等 3 分钟
        setTimeout(() => { clearInterval(poll); btn.disabled = false; btn.textContent = "▶ 开始评测"; }, 180000);
      } catch (err) {
        App.toast(err.message, "error");
        btn.disabled = false; btn.textContent = "▶ 开始评测";
      }
    };

    document.getElementById("reinforce-btn").onclick = async () => {
      if (!currentTaskId) return;
      const btn = document.getElementById("reinforce-btn");
      btn.disabled = true; btn.textContent = "启动中...";
      try {
        const res = await App.api.post(`/api/training/${currentTaskId}/reinforce`, {});
        App.toast(`追加训练已启动（${res.data.scored} 条已评分样本）`, "success");
      } catch (err) { App.toast(err.message, "error"); }
      finally { btn.disabled = false; btn.textContent = "⚡ 用评分追加训练"; }
    };

    function showProgressCard() {
      document.getElementById("progress-card").style.display = "";
      const ph = document.getElementById("progress-placeholder");
      if (ph) ph.style.display = "none";
    }

    window.viewEvalDialogs = (id) => {
      const t = _historyCache.find(x => x.id === id);
      if (t) renderEvalResults(t);
      showProgressCard();
      document.getElementById("progress-card").scrollIntoView({ behavior: "smooth" });
    };

    function startStreaming(taskId) {
      currentTaskId = taskId;
      // 显示进度卡片
      const card = document.getElementById("progress-card");
      showProgressCard();
      // 重置 loss
      lossVals = [];
      if (lossChartTimer) { clearTimeout(lossChartTimer); lossChartTimer = null; }
      drawLossChart();
      document.getElementById("cur-loss").textContent = "-";
      document.getElementById("loss-count").textContent = "0";

      const logBox = document.getElementById("log-box");
      const pFill = document.getElementById("p-fill");
      const pct = document.getElementById("pct");
      const tStatus = document.getElementById("t-status");
      logBox.innerHTML = "";

      App.streamSSE(`/api/training/${taskId}/log/stream`, (msg) => {
        if (msg.type === "log") {
          const line = document.createElement("div");
          line.className = "log-line";
          const txt = msg.content || "";
          if (txt.includes("错误") || txt.includes("失败")) line.classList.add("error");
          else if (txt.includes("完成") || txt.includes("✓") || txt.includes("训练完成")) line.classList.add("success");
          else if (txt.includes("阶段") || txt.includes("----") || txt.includes("Epoch")) line.classList.add("info");
          line.textContent = txt;
          logBox.appendChild(line);
          logBox.scrollTop = logBox.scrollHeight;
          // 解析 loss
          const m = txt.match(/loss[=: ]+([0-9]+\.?[0-9]*)/i);
          if (m) appendLoss(parseFloat(m[1]));
        } else if (msg.type === "status") {
          const p = msg.progress ?? 0;
          pFill.style.width = p + "%";
          pct.textContent = p.toFixed(1) + "%";
          if (msg.status === "completed") { tStatus.className = "badge badge-success"; tStatus.textContent = "已完成"; }
          if (msg.status === "failed") { tStatus.className = "badge badge-danger"; tStatus.textContent = "失败"; }
        } else if (msg.type === "done") {
          App.toast("训练完成！", "success");
          // 收尾绘制
          if (lossChartTimer) { clearTimeout(lossChartTimer); lossChartTimer = null; }
          drawLossChart();
          // 拉取任务详情（含对话评测结果）展示打分面板
          loadHistory().then(() => {
            const t = _historyCache.find(x => x.id === taskId);
            if (t) renderEvalResults(t);
          });
        }
      }).catch(err => {
        App.toast(err.message, "error");
        // SSE 失败时清理定时器并标记状态
        if (lossChartTimer) { clearTimeout(lossChartTimer); lossChartTimer = null; }
        tStatus.className = "badge badge-danger"; tStatus.textContent = "连接中断";
      });
    }

    async function loadHistory() {
      const el = document.getElementById("task-history");
      try {
        const list = await App.api.get("/api/training");
        _historyCache = list || [];
        if (list.length === 0) {
          el.innerHTML = `<div class="empty-state"><div class="empty-icon">✦</div><div class="empty-text">暂无训练任务</div></div>`;
          return;
        }
        el.innerHTML = list.map(t => {
          const hasEval = t.status === "completed" && Array.isArray(t.evaluation) && t.evaluation.length > 0;
          const hasDialogs = t.status === "completed" && Array.isArray(t.eval_dialogs) && t.eval_dialogs.length > 0;
          const scoreTag = hasDialogs ? `<span class="tag" style="background:${(t.eval_score || 0) >= 0 ? "var(--accent)" : "#c0392b"};color:#fff">评测 ${t.eval_score || 0} 分</span>` : "";
          return `
          <div class="list-item">
            <div class="list-item-main">
              <div class="list-item-title">${App.escapeHtml(t.name)} <span class="tag">${t.mode === "simple" ? "傻瓜" : "专业"}</span>${scoreTag}</div>
              <div class="list-item-sub">${App.formatTime(t.created_at)} · 进度 ${(t.progress ?? 0).toFixed(0)}%</div>
            </div>
            <div class="flex items-center gap-1">
              ${App.statusBadge(t.status)}
              ${hasDialogs ? `<button class="btn btn-ghost btn-sm" onclick="viewEvalDialogs('${t.id}')">对话评测</button>` : ""}
              ${hasEval ? `<button class="btn btn-ghost btn-sm" onclick="viewEvaluation('${t.id}')">查看评估</button>` : ""}
              <button class="btn btn-ghost btn-sm" onclick="viewLog('${t.id}')">查看日志</button>
            </div>
          </div>
        `;}).join("");
      } catch (err) { App.toast(err.message, "error"); }
    }

    function viewEvaluation(id) {
      const t = _historyCache.find(x => x.id === id);
      if (!t || !Array.isArray(t.evaluation) || t.evaluation.length === 0) {
        App.toast("暂无评估结果", "error");
        return;
      }
      const wrap = document.createElement("div");
      wrap.style.cssText = "display:flex;flex-direction:column;gap:14px;max-height:70vh;overflow:auto";
      const intro = document.createElement("div");
      intro.className = "alert alert-info";
      intro.innerHTML = `训练完成后自动评估：用 <strong>${t.evaluation.length}</strong> 组预设 prompt 对比<strong>基础模型</strong>与<strong>微调模型</strong>的回复。`;
      wrap.appendChild(intro);
      t.evaluation.forEach((item, i) => {
        const block = document.createElement("div");
        block.style.cssText = "border:1px solid var(--border);border-radius:10px;overflow:hidden";
        const head = document.createElement("div");
        head.style.cssText = "padding:9px 12px;background:var(--surface-hover);font-size:12px;color:var(--text-muted);border-bottom:1px solid var(--border)";
        head.textContent = `评估 ${i + 1} · ${item.prompt}`;
        block.appendChild(head);
        const grid = document.createElement("div");
        grid.style.cssText = "display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border)";
        const baseCell = document.createElement("div");
        baseCell.style.cssText = "padding:11px 12px;background:var(--surface)";
        baseCell.innerHTML = `<div style="font-size:11px;color:var(--text-muted);margin-bottom:6px">基础模型</div><div style="font-size:13px;line-height:1.55;white-space:pre-wrap;word-break:break-word">${App.escapeHtml(item.base_reply || "（空）")}</div>`;
        const ftCell = document.createElement("div");
        ftCell.style.cssText = "padding:11px 12px;background:var(--surface)";
        ftCell.innerHTML = `<div style="font-size:11px;color:var(--accent);margin-bottom:6px">微调模型</div><div style="font-size:13px;line-height:1.55;white-space:pre-wrap;word-break:break-word">${App.escapeHtml(item.finetuned_reply || "（空）")}</div>`;
        grid.appendChild(baseCell);
        grid.appendChild(ftCell);
        block.appendChild(grid);
        if (item.error) {
          const err = document.createElement("div");
          err.className = "alert alert-warning";
          err.style.cssText = "margin:0;border-radius:0;border-left:none;border-right:none;border-top:1px solid var(--border)";
          err.textContent = "评估异常：" + item.error;
          block.appendChild(err);
        }
        wrap.appendChild(block);
      });
      App.modal({ title: "训练评估对比", body: wrap });
    }

    async function viewLog(id) {
      try {
        const data = await App.api.get(`/api/training/${id}/log`);
        const pre = document.createElement("pre");
        pre.className = "log-viewer";
        pre.style.maxHeight = "420px";
        pre.textContent = data?.data?.log || "（暂无日志）";
        App.modal({ title: "训练日志", body: pre });
      } catch (err) { App.toast(err.message, "error"); }
    }

    loadOptions();
    loadParams();
    loadHistory();
  </script>
</body>
</html>
